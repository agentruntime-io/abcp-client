name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The heavy tests (conformance vectors, CRDT corpora, the integration run against the Go server) need an
      # abcp-server checkout (ABCP_SERVER_DIR) and skip here.
      - run: npm test
