// ABCP v2.0 — client-facing service. Transport: the binding of spec/02 §2.9 (protocols, codecs, error details,
// compression, message sizes); TLS: spec/16 [SEC-45].
// Browsers cannot open bidirectional streams, so Subscribe is server-streaming and every
// client→server control message on a live session is a unary call naming the session (spec/09 §9.4).
syntax = "proto3";

package abcp.v2;

import "abcp/v2/types.proto";
import "google/protobuf/timestamp.proto";

service SyncService {
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);   // spec/04 §4.7

  // Writes (spec/07, spec/08)
  rpc Mutate(MutateRequest) returns (MutateResponse);
  rpc GetMutationResult(GetMutationResultRequest) returns (GetMutationResultResponse);
  rpc GetMutationResults(GetMutationResultsRequest) returns (GetMutationResultsResponse);  // 1–100 ids (spec/07 [MUT-107])
  rpc CancelIntent(CancelIntentRequest) returns (CancelIntentResponse);
  rpc CreateKeyspace(CreateKeyspaceRequest) returns (CreateKeyspaceResponse);  // users (keyspace:create) and admins alike

  // Reads and delivery (spec/09)
  rpc LoadState(LoadStateRequest) returns (LoadStateResponse);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);  // in-band token refresh

  // Presence (spec/09 §9.8)
  rpc JoinPresence(JoinPresenceRequest) returns (JoinPresenceResponse);
  rpc PublishPresence(PublishPresenceRequest) returns (PublishPresenceResponse);
  rpc LeavePresence(LeavePresenceRequest) returns (LeavePresenceResponse);

  // Blobs (spec/09 §9.9)
  // Every blob call answers in every state of the blob as the second table of spec/09 [READ-4] says.
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);   // refused with KEYSPACE_ARCHIVED on an archived or split keyspace (spec/09 [READ-4], [READ-86])
  rpc CommitBlob(CommitBlobRequest) returns (CommitBlobResponse);   // likewise for a pending blob (spec/09 [READ-88])
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);   // a withheld blob: Unavailable and Retry{BLOB_WITHHELD}, through any keyspace (spec/09 [READ-90]); a mutation that names it is accepted (spec/09 [READ-89])
  rpc DeleteBlob(DeleteBlobRequest) returns (DeleteBlobResponse);   // served on an archived or split keyspace, and on a deleted keyspace that still holds retained data (spec/09 [READ-91]); a withheld blob, through a keyspace that is not frozen: Unavailable and Retry{BLOB_WITHHELD}; an id with no row: NotFound to admin, PermissionDenied to every other caller
  // Discovery (spec/09 §9.11), EXPERIMENTAL: not part of v2.0, behind the feature x-list-keyspaces.v1, and served only
  // when ServerInfo.features lists it; otherwise Unimplemented (spec/15 [COMPAT-28]). SERVICE and admin-issuer principals
  // only; it lists only the keyspaces that the caller may read (spec/09 [XKS-2], [XKS-4]).
  rpc ListKeyspaces(ListKeyspacesRequest) returns (ListKeyspacesResponse);
}

// A body over 64 KiB, counted as it inflates, is refused with InvalidArgument (spec/02 [ARC-63]).
message GetServerInfoRequest {}
message GetServerInfoResponse { ServerInfo server_info = 1; }

message GetManifestRequest { uint32 version = 1; }   // 0 = the active version

// manifest: the version's JCS canonical json/v1 form (spec/04 [MAN-4]), with encoding "json/v1"; sha256: its SHA-256,
// the manifest's hash. source: the document as published, in source_encoding ("json/v1" or "yaml/v1", spec/04 §4.7),
// at most 4 MiB (spec/04 [MAN-4]).
message GetManifestResponse {
  uint32 version = 1;
  bytes manifest = 2;
  string encoding = 3;
  bytes sha256 = 4;
  bytes source = 5;
  string source_encoding = 6;
}

// ───────────────────────────── Mutate ─────────────────────────────

message Mutation {
  string mutation_id = 1;                 // idempotency key: random (≥122 bits) or derived by a service principal (spec/03 §3.5)
  string keyspace_id = 2;
  string op_type = 3;
  Lane lane = 4;                          // must match the op type's dispatch in the authored manifest
  repeated KeyChange changes = 5;         // 1..N, all in keyspace_id
  repeated Precondition preconditions = 6;
  string client_id = 7;                   // ephemeral client instance (spec/10 §10.3)
  uint64 client_seq = 8;                  // position in this client's lane, contiguous from 1
  uint64 after_client_seq = 9;            // GATED only, and only with a non-empty client_id: wait for this SEQUENCED client_seq (spec/07 §7.5, [MUT-28])
  uint64 base_seq = 10;                   // client's confirmed watermark for keyspace_id when authored; an action re-routed
                                          // to a split successor keeps that base, its watermark in the source, whatever
                                          // the client loaded since (spec/14 [CLI-52]), judged against the source's
                                          // records (spec/07 [MUT-84])
  uint32 base_log_epoch = 18;             // epoch of base_seq; 0 = not given (spec/05 [STATE-81]), refused with INVALID_ENVELOPE
                                          // in every action of a SERVICE principal, host appends and module actions
                                          // included (spec/07 [MUT-108]); another epoch: STALE{EPOCH}, but for a spend
                                          // action and a split successor's base in its source (spec/05 [STATE-81])
  uint32 authored_manifest_version = 11;
  repeated string required_features = 12;
  string causation_id = 13;
  string correlation_id = 14;
  google.protobuf.Timestamp authored_at = 15;   // advisory (spec/10 [AUTH-57]); module and host actions leave it unset (spec/07 [MUT-90]);
                                                // out of the range of spec/02 [ARC-61]: INVALID_ENVELOPE for this mutation
                                                // when the request decodes; in the JSON codec the whole call fails
  string reason = 16;                     // set only on an override-only action, which requires it (spec/12 §12.8), at
                                          // most 1,024 octets, no U+0000; empty on every other action, or INVALID_ENVELOPE
                                          // (spec/07 [MUT-18], Table 7-2 item 9)
  repeated string blob_refs = 17;         // blobs this action references (spec/09 §9.9), at most 1,000 entries, or
                                          // INVALID_ENVELOPE (spec/07 Table 7-2 item 9); the action's records keep
                                          // them unchanged in Record.blob_refs (spec/06 [LOG-90])
}

message MutateRequest {
  repeated Mutation mutations = 1;        // a transport batch; each mutation is its own action
  repeated string supported_features = 2;
}

message Appended {
  uint64 seq = 1;
  repeated uint32 overwrote_newer = 2;    // indexes of changes that replaced a newer value, in increasing order (spec/05 [STATE-62])
  uint32 log_epoch = 3;                   // the epoch the outcome was committed in; retirement: spec/14 [CLI-7]
}

message Decided {
  DecisionStatus status = 1;
  uint64 decision_seq = 2;
  Reject reject = 3;                      // REJECTED only
  uint32 log_epoch = 4;                   // the epoch the outcome was committed in; retirement: spec/14 [CLI-7]
}

message MutationResult {
  string mutation_id = 1;
  oneof outcome {
    Appended appended = 2;                // SEQUENCED, applied
    Decided decided = 3;                  // GATED, terminal
    Reject rejected = 4;                  // not applied; see Reject.error_class
    Retry retry = 5;                      // not processed or not decided yet; resend the identical mutation
  }
  bool duplicate = 6;                     // this mutation id was already processed; outcome is the stored one
  uint64 intent_seq = 7;                  // GATED: seq of the INTENT record (pending row), if logged
}

// A client ignores a lane watermark whose client_id or log_epoch is not its current one. The lane watermark of one
// (client_id, log_epoch, keyspace_id, lane) never decreases (spec/07 §7.4, spec/14 [CLI-78]).
message LaneWatermark {
  string keyspace_id = 1;
  Lane lane = 2;
  uint64 processed_client_seq = 3;        // every client_seq ≤ this has a definitive result
  string client_id = 4;                   // the client instance whose lane this is
  uint32 log_epoch = 5;                   // the keyspace's epoch the watermark was taken in; 0, with processed_client_seq 0,
                                          // for a pair that no mutation of the request took through the binding check
                                          // (spec/07 [MUT-7])
}

message MutateResponse {
  repeated MutationResult results = 1;    // same order as the request
  repeated LaneWatermark watermarks = 2;  // one for every lane the request touched; they, not the codes, tell slot consumption (spec/07 §7.4);
                                          // in increasing order of (keyspace_id, lane), spec/07 [MUT-7]
}

message GetMutationResultRequest {
  string keyspace_id = 1;
  string mutation_id = 2;
}

// Answered from the id's binding and voided marker alone, checked in the order of spec/07 [MUT-53]: the call never
// fails with an existence error, so a keyspace that does not exist, is deleted or is a seeding successor answers
// known = false, voided = false; of the keyspace's states, only a frozen one fails the call, as MUT-53 says.
// When it answers (spec/07 §7.6, spec/14 [CLI-24], [CLI-53]):
//   known = true: `result` is the stored outcome, for the bound subject only; it stands. After a resend of a voided id,
//     it is the recorded Reject{STALE{EPOCH}} that the resend got, or, for a spend action, the outcome of the resend,
//     which is processed as a new action (spec/07 [MUT-105]);
//   known = false, voided = true: an epoch advance voided the binding, and the action is lost: the client reports
//     it to the user and never resubmits it, except a spend action, which its outbox resends once, unchanged
//     (spec/02 [ARC-52] item 6);
//   known = false, voided = false: for an action sent in an earlier epoch, the outcome is unknown, not lost: the
//     client never resubmits it, except a spend action as above, and reports it as outcome-unknown to the app's export
//     hook (spec/14 [CLI-53]). For an action sent in the current epoch it proves nothing: the client resends the
//     identical action (spec/14 [CLI-24]).
message GetMutationResultResponse {
  bool known = 1;
  MutationResult result = 2;
  bool voided = 3;                        // like known, told only to the subject the binding named; the server keeps
                                          // the voided marker for at least the max_offline in force after the advance,
                                          // unless the keyspace is deleted (spec/07 [MUT-51], [MUT-53])
}

// 1 to 100 mutation ids of one keyspace. Each id is answered as GetMutationResult answers it (spec/07 [MUT-107]).
message GetMutationResultsRequest {
  string keyspace_id = 1;
  repeated string mutation_ids = 2;      // each in the mutation-id syntax (spec/03 [ID-30])
}

message GetMutationResultsResponse {
  repeated GetMutationResultResponse results = 1;   // one per requested id, in the request's order
}

message CancelIntentRequest {
  string keyspace_id = 1;
  string intent_id = 2;                   // the GATED mutation id
}

// A caller without read and write:<op_type> on the keyspace for at least one op type of the app's active manifest (or
// admin on it) gets PermissionDenied before any lookup, whether or not the keyspace or the id exists (spec/10
// [AUTH-40], spec/08 [GATE-58]). Other errors follow spec/08 [GATE-102].
message CancelIntentResponse {
  MutationResult result = 1;              // Decided{REJECTED, CANCELLED}; for an id with no binding, an unlogged
                                          // Reject{CANCELLED}; for an id with a voided marker, Reject{STALE} with cause
                                          // EPOCH (spec/08 [GATE-60]); or the earlier terminal outcome (spec/08 §8.7)
}

message CreateKeyspaceRequest {
  string keyspace_id = 1;                 // path id (spec/03 §3.2); last segment may be client-minted
  string kind = 2;                        // a keyspace kind of the active manifest
}

message CreateKeyspaceResponse {
  bool created = 1;                       // false if it already existed with the same kind, by the same subject (idempotent, spec/07 [MUT-95])
  uint32 log_epoch = 2;
}

// ───────────────────────────── Reads ─────────────────────────────

message LoadStateRequest {
  KeyspaceCursor cursor = 1;              // after_seq = 0 → full cold load
  string client_id = 5;                   // optional: return this client instance's lane watermarks; never binds it
                                          // (spec/09 [READ-19])
  string page_token = 2;
  uint32 page_size = 3;                   // a count bound: 0 = 1,000; a value above 10,000 counts as 10,000 (spec/09 [READ-10]).
                                          // A page also stops before its next entry or redaction would pass 16 MiB in the
                                          // call's codec (spec/09 [READ-10])
  repeated string supported_features = 4;
}

message LoadStateResponse {
  uint64 checkpoint_seq = 1;              // pages are consistent as of this seq
  uint32 log_epoch = 2;
  repeated KeyEntry entries = 3;          // includes retained tombstones (KeyEntry.deleted) that match the interest, and the
                                          // entity and staged tombstones of ancestors of an interest prefix (spec/09 [READ-9]);
                                          // a redaction's tombstone and a redacted-state entry carry KeyEntry.redacted;
                                          // in ascending order of the key's UTF-8 bytes across the pages of one load
                                          // (spec/09 [READ-8], [READ-10])
  string next_page_token = 4;             // empty on the last page
  uint64 head_seq = 5;
  uint32 manifest_version = 6;            // the version in force at checkpoint_seq (spec/09 [READ-19])
  ServerInfo server_info = 7;
  AppLimits limits = 8;
  repeated SuccessorRule successors = 9;  // set when the keyspace was split or archived with successors: the whole
                                          // successor map, on every page, in the order that spec/12 [ADM-45] gives
  string kind = 10;
  repeated LaneWatermark lane_watermarks = 11;  // for LoadStateRequest.client_id; in the order of spec/07 [MUT-7]
  reserved 12;                            // was epoch_base_seq (draft only); outcomes from earlier epochs are confirmed with GetMutationResult
  reserved "epoch_base_seq";
  bool resumed = 13;                      // true only when this continues cursor.after_seq in the same epoch; false = full replace
  KeyspaceLifecycle lifecycle = 14;
  bool skipped_unsupported = 15;          // true when this cold load skipped records whose required_features the client
                                          // lacks, by loading from a checkpoint at or above them (spec/09 §9.2, [READ-17];
                                          // spec/15 [COMPAT-15]); the client emits `skipped` (spec/14)
  repeated KeyRedaction redactions = 16;  // a cold load that answers a resume check: every erasure-ledger redaction newer
                                          // than the cursor, whatever the interest, taken once at the load's first page,
                                          // in increasing (log_epoch, redaction_seq) then key order, each once across the
                                          // pages and at most 1,000 per page (spec/09 [READ-100]); the client purges and
                                          // resets those keys (spec/14 [CLI-76])
}

message SubscribeRequest {
  repeated KeyspaceCursor keyspaces = 1;
  repeated string supported_features = 2;
  string client_id = 3;                   // the client instance, checked as spec/10 [AUTH-20] says and bound as the last
                                          // step before the first frame (spec/09 [READ-99]); used for presence and lane
                                          // watermarks
}

message RecordsFrame {
  string keyspace_id = 1;
  uint64 prev_cursor = 2;
  uint64 cursor = 3;                      // the delivery watermark after these records (spec/09 §9.5)
  repeated Record records = 4;            // whole records; the frame stops before the next record would pass 16 MiB
                                          // in the call's codec (spec/09 [READ-101])
}

message HeartbeatFrame {
  message Cursor { string keyspace_id = 1; uint64 cursor_seq = 2; uint64 head_seq = 3; uint32 log_epoch = 4; }
  repeated Cursor cursors = 1;                  // one per followed keyspace; a followed keyspace missing from it counts as
                                                // removed from the session (spec/09 [READ-54])
  google.protobuf.Timestamp server_time = 2;    // read from the one time source of spec/10 [AUTH-66]
  repeated LaneWatermark lane_watermarks = 3;   // this session's client instance; in the order of spec/07 [MUT-7]
  google.protobuf.Timestamp app_resumed_at = 4; // the resume time of the app's latest suspension (spec/12 [ADM-18]);
                                                // unset when the app has never been suspended. Every module counts from
                                                // it every floor after a resume that spec/11 sets, the bounds of
                                                // [COORD-12] and [COORD-67] included (spec/11 [COORD-90], [COORD-117];
                                                // spec/09 [READ-54])
}

enum DropReason {
  DROP_REASON_UNSPECIFIED = 0;
  DROP_REASON_GRANT_CHANGED = 1;      // no longer granted; keep or purge per app policy
  DROP_REASON_ACCESS_REVOKED = 2;     // RevokeAccess (spec/10 [AUTH-51], [AUTH-52]): purge local copy, quarantine outbox
  DROP_REASON_MOVED = 3;              // split: re-route queued actions to the successors (spec/14 [CLI-52])
  DROP_REASON_RESUME_TOO_OLD = 4;     // cursor below the prune floor, or unverifiable: cold load, made as a resume check
                                      // from the cursor (spec/09 [READ-17], [READ-65])
  DROP_REASON_HISTORY_DIVERGED = 5;   // keyspace frozen (spec/13 §13.5)
  DROP_REASON_ARCHIVED = 6;           // as KEYSPACE_ARCHIVED for an archive: nothing is re-routed; queued actions are
                                      // dead-lettered with the successors (spec/14 [CLI-52])
  DROP_REASON_DELETED = 7;
  DROP_REASON_EPOCH_CHANGED = 8;      // log_epoch advanced: cold load, made as a resume check from the cursor
                                      // (spec/14 [CLI-51]; spec/09 [READ-100])
  DROP_REASON_UPGRADE_REQUIRED = 9;
  DROP_REASON_NOT_FOUND = 10;         // the requested keyspace does not exist; sent only to a caller whose grants would
                                      // match it, others get GRANT_CHANGED (spec/09 [READ-32])
}

// Why a whole session ends (Appendix A.8). Per-keyspace endings use KeyspaceDropped.
enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  CLOSE_REASON_TOKEN_EXPIRED = 1;      // the token expired and was not refreshed in band, or the issuer entry that
                                       // verified it was removed or changed (spec/10 [AUTH-7])
  CLOSE_REASON_SUBJECT_REVOKED = 2;    // RevokeAccess on a subject that matches the principal of the session's governing token (its sub,
                                       // or any sub of its actor_chain, spec/10 [AUTH-51])
  CLOSE_REASON_CLIENT_TOO_OLD = 3;     // every requested keyspace would be dropped with UPGRADE_REQUIRED (spec/09 [READ-40])
  CLOSE_REASON_APP_SUSPENDED = 4;
}

message ControlFrame {
  // heartbeat_interval_ms: server-chosen, 5,000–20,000, default 15,000 (spec/09 §9.6)
  message Subscribed { string session_id = 1; AppLimits limits = 2; ServerInfo server_info = 3; uint32 heartbeat_interval_ms = 4; }
  message Reconnect { uint32 retry_after_ms = 1; }   // at most 3,600,000 (spec/04 Table 4.11); 0 names no delay: the client waits its own reconnect backoff alone (spec/09 [READ-57])
  message Closing { CloseReason reason = 1; string message = 2; }
  message KeyspaceAdded { KeyspaceCursor cursor = 1; }
  // successors: the whole successor map, for MOVED and ARCHIVED, in the order that spec/12 [ADM-45] gives
  // (spec/09 [READ-68])
  message KeyspaceDropped { string keyspace_id = 1; DropReason reason = 2; repeated SuccessorRule successors = 3; }
  oneof control {
    Subscribed subscribed = 1;
    Reconnect reconnect = 2;
    Closing closing = 3;
    KeyspaceAdded keyspace_added = 4;
    KeyspaceDropped keyspace_dropped = 5;
  }
}

message PresenceEntry {
  Principal principal = 1;
  string client_id = 2;                   // the key of the entry; a Yjs numeric clientID stays inside `state`
  bytes state = 3;                        // validated against the kind's presence schema; one entry per engine for all its
                                          // tabs; a Yjs awareness topic (spec/09 [READ-72]): a map from tab id to that tab's y-protocols state, json/v1 (spec/09 §9.8)
  google.protobuf.Timestamp expires_at = 4;
}

message PresenceFrame {
  string keyspace_id = 1;
  string topic = 2;
  bool snapshot = 3;                      // true: the snapshot sent on join (spec/09 §9.8)
  repeated PresenceEntry entries = 4;     // upserts; whole entries within 16 MiB in the call's codec (spec/09 [READ-101])
  repeated string left_client_ids = 5;    // only entries that were visible to this member
}

message SubscribeResponse {
  oneof frame {
    RecordsFrame records = 1;
    HeartbeatFrame heartbeat = 2;
    ControlFrame control = 3;
    PresenceFrame presence = 4;
  }
}

message UpdateSubscriptionRequest {
  string session_id = 1;
  repeated KeyspaceCursor add = 2;
  repeated string remove = 3;
  message Interest { string keyspace_id = 1; repeated string interest_prefixes = 2; }
  repeated Interest set_interest = 4;
  string client_id = 5;                   // set: rebinds the session's client instance, e.g. after a flusher
                                          // handover (spec/09 [READ-99], spec/14 [CLI-63]), and the client then
                                          // re-publishes its presence at once (spec/09 §9.8); empty, or the session's
                                          // current id: unchanged (spec/09 [READ-99])
}

message UpdateSubscriptionResponse {
  // Exactly one of reject or retry is set. retry: Retry{AUTHORIZER_UNAVAILABLE}, or Retry{KEYSPACE_SEEDING} for a split
  // successor still seeding (spec/09 [READ-64]).
  message Rejection {
    string keyspace_id = 1;
    oneof outcome {
      Reject reject = 2;
      Retry retry = 3;
    }
  }
  repeated Rejection rejected = 1;        // refused add and set_interest entries: not granted, unknown, malformed, over a
                                          // limit, or not decidable now (retry) (spec/09 [READ-64]); bounded by the
                                          // request's entries (spec/09 [READ-62])
}

message RefreshSessionRequest {
  string session_id = 1;                  // the new token is in this call's Authorization header
}

message RefreshSessionResponse {
  google.protobuf.Timestamp expires_at = 1;
  repeated string dropped_keyspace_ids = 2;    // informational: keyspaces the new token no longer grants; clients act on
                                               // the KeyspaceDropped frames (spec/09 [READ-39])
}

// ───────────────────────────── Presence ─────────────────────────────

message JoinPresenceRequest { string session_id = 1; string keyspace_id = 2; string topic = 3; }
message JoinPresenceResponse {}
message PublishPresenceRequest { string session_id = 1; string keyspace_id = 2; string topic = 3; bytes state = 4; }
message PublishPresenceResponse { google.protobuf.Timestamp expires_at = 1; }
message LeavePresenceRequest { string session_id = 1; string keyspace_id = 2; string topic = 3; }
message LeavePresenceResponse {}

// ───────────────────────────── Blobs ─────────────────────────────

message CreateUploadRequest {
  string keyspace_id = 1;
  string blob_id = 2;                     // client-generated, [A-Za-z0-9_-]{21,64}, at least 122 random bits, never derived
                                          // from the content or from personal data: no erasure removes it (spec/09 [READ-84])
  bytes sha256 = 3;                       // SHA-256 of the content, 32 raw bytes
  uint64 size = 4;                        // counted in bytes_per_app from the call, pending or committed (spec/09 [READ-86])
  string content_type = 5;                // at most 255 octets; empty = application/octet-stream (spec/09 [READ-86])
}

message CreateUploadResponse {
  string upload_url = 1;                  // signed PUT with checksum and length bound in
  google.protobuf.Timestamp expires_at = 2;
  bool already_committed = 3;             // same id, sha256 and size already committed: then upload_url, expires_at and
                                          // upload_headers are unset
  map<string, string> upload_headers = 4; // the exact headers the client sends with the PUT, besides Content-Length
                                          // (spec/09 [READ-86])
}

message CommitBlobRequest { string keyspace_id = 1; string blob_id = 2; }
message CommitBlobResponse {}
message GetBlobRequest { string keyspace_id = 1; string blob_id = 2; }
// download_url: a signed bearer URL, valid for at most 15 minutes (spec/09 [READ-90]); it still serves after a revocation of the
// caller until it expires (spec/10 [AUTH-51]). sha256: 32 raw bytes.
message GetBlobResponse { string download_url = 1; bytes sha256 = 2; uint64 size = 3; string content_type = 4; }
message DeleteBlobRequest {
  string keyspace_id = 1;
  string blob_id = 2;
  string reason = 3;                      // required, at most 1,024 octets, no U+0000 (spec/09 [READ-91]). The BLOB_DELETED record
                                          // carries it only for a caller from the admin issuer; for any other caller it
                                          // goes to the erasure ledger only (spec/06 [LOG-38], [LOG-79]). No personal
                                          // data (spec/12 [ADM-72])
}
message DeleteBlobResponse {}

// ───────────────────────────── ListKeyspaces (experimental, spec/09 §9.11) ─────────────────────────────

// The filters and pages of spec/09 [XKS-3] to [XKS-6]. A result matches every filter given.
message ListKeyspacesRequest {
  string kind = 1;                              // a keyspace kind (spec/03 Table 3.1); empty = every kind
  string keyspace_pattern = 2;                  // an id pattern (spec/03 §3.7); empty = "**"; invalid: InvalidArgument and
                                                // Reject{INVALID_ENVELOPE}
  google.protobuf.Timestamp created_after = 3;  // exclusive; unset = from the oldest
  bool include_archived = 4;                    // also list ARCHIVED keyspaces and split sources (SPLIT); deleted ones never
  string page_token = 5;                        // a next_page_token: it fixes the filters and the caller's subject; a request
                                                // whose filters or caller differ fails with InvalidArgument and
                                                // Reject{INVALID_ENVELOPE}; past its validity, FailedPrecondition (spec/09 [XKS-6])
  uint32 page_size = 6;                         // 0 = 100; a larger value counts as 1,000; a page may hold fewer, and also stops
                                                // before 16 MiB (spec/09 [XKS-6])
}

// One listed keyspace: its id, kind, creation time and lifecycle, and nothing else (spec/09 [XKS-9]).
message ListedKeyspace {
  string keyspace_id = 1;
  string kind = 2;
  google.protobuf.Timestamp created_at = 3;     // the server time of its creation, or of the split that made it (spec/12 [ADM-41])
  KeyspaceLifecycle lifecycle = 4;              // ACTIVE; ARCHIVED or SPLIT only with include_archived
}

message ListKeyspacesResponse {
  repeated ListedKeyspace keyspaces = 1;        // ordered by created_at (seconds, then nanos), then keyspace_id in byte order
  string next_page_token = 2;                   // empty: the listing is complete; set: more may follow, even after a short or
                                                // empty page (spec/09 [XKS-6])
}
