# `npm run gen`: the TypeScript wire code (protoc-gen-es) from proto/abcp into src/gen.
# The managed block is the server template's: it fixes the file options that the generated descriptors embed, so that
# src/gen is byte-for-byte what the server repo generates.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/agentruntime-io/abcp-server/server/gen
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: proto
